<!DOCTYPE html>
<html lang="en" data-stage-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vernox Vision — 15,000+ Creator Video Asset Vault & Hardware System</title>
    <meta
      name="description"
      content="15,000+ curated video assets, viral hooks, and creator frameworks delivered instantly via private Google Drive. $9.99 one-time. Commercial rights included."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vernoxvision.com/" />
    <meta name="theme-color" content="#0A0A0A" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('vv_stage_mode');
          if (mode === 'light') {
            document.documentElement.setAttribute('data-stage-mode', 'light');
          } else {
            document.documentElement.setAttribute('data-stage-mode', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-stage-mode', 'dark');
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:site_name" content="Vernox Vision" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vernox Vision — 15,000+ Creator Video Asset Vault" />
    <meta
      property="og:description"
      content="15,000+ curated video assets, viral hooks, and creator frameworks delivered instantly via private Google Drive. $9.99 one-time. Commercial rights included."
    />
    <meta property="og:url" content="https://vernoxvision.com/" />
    <meta property="og:image" content="https://vernoxvision.com/previews/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vernox Vision — 15,000+ Creator Video Asset Vault" />
    <meta
      name="twitter:description"
      content="15,000+ curated video assets, viral hooks, and creator frameworks delivered instantly via private Google Drive. $9.99 one-time. Commercial rights included."
    />
    <meta name="twitter:image" content="https://vernoxvision.com/previews/og-image.svg" />

    <!-- Favicon: Primary Vernox Vision Logo -->
    <link rel="icon" type="image/jpeg" href="/vernox-vision-logo.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/vernox-vision-logo.jpeg" />
    <link rel="apple-touch-icon" href="/vernox-vision-logo.jpeg" />

    <!-- Preload ONLY Archivo (the LCP font) -->
    <link
      rel="preload"
      href="/fonts/archivo-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!-- Gumroad Overlay Integration -->
    <script src="https://gumroad.com/js/gumroad.js" async></script>

    <!-- JSON-LD Product Schema (Honest data only: no fake aggregateRating) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Vernox Vision Creator Asset Vault",
        "description": "15,000+ curated video assets, viral hooks, and creator frameworks across 4 video bundles and 3 PDF guides, delivered via private Google Drive.",
        "brand": {
          "@type": "Brand",
          "name": "Vernox Vision"
        },
        "offers": {
          "@type": "Offer",
          "url": "https://vernoxvision.gumroad.com/l/vernoxvision",
          "priceCurrency": "USD",
          "price": "9.99",
          "priceValidUntil": "2030-12-31",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] antialiased selection:bg-[var(--accent)] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
