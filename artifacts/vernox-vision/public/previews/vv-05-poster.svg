<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800">
  <rect width="640" height="800" fill="#F4F4F2" />
  <rect x="24" y="24" width="592" height="752" fill="none" stroke="#D0D0CE" stroke-width="1.5" />
  
  <text x="44" y="70" fill="#5E5E5B" font-family="monospace" font-size="12" letter-spacing="2">VV—05 // 30-DAY CONTENT CALENDAR</text>
  <rect x="550" y="55" width="40" height="20" rx="2" fill="#FF5A1F" />
  <text x="570" y="69" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-weight="bold" font-size="10">PDF</text>

  <!-- 30-day matrix visual -->
  <g transform="translate(60, 160)">
    <!-- 6 columns x 5 rows grid -->
    <rect x="0" y="0" width="520" height="420" fill="#E8E8E4" stroke="#D0D0CE" stroke-width="1" />
    <!-- Grid lines -->
    <line x1="86" y1="0" x2="86" y2="420" stroke="#D0D0CE" />
    <line x1="172" y1="0" x2="172" y2="420" stroke="#D0D0CE" />
    <line x1="258" y1="0" x2="258" y2="420" stroke="#D0D0CE" />
    <line x1="344" y1="0" x2="344" y2="420" stroke="#D0D0CE" />
    <line x1="430" y1="0" x2="430" y2="420" stroke="#D0D0CE" />
    
    <line x1="0" y1="84" x2="520" y2="84" stroke="#D0D0CE" />
    <line x1="0" y1="168" x2="520" y2="168" stroke="#D0D0CE" />
    <line x1="0" y1="252" x2="520" y2="252" stroke="#D0D0CE" />
    <line x1="0" y1="336" x2="520" y2="336" stroke="#D0D0CE" />

    <!-- Marked highlight days -->
    <rect x="88" y="2" width="82" height="80" fill="#FF5A1F" fill-opacity="0.15" />
    <circle cx="102" cy="18" r="4" fill="#FF5A1F" />
    
    <rect x="260" y="86" width="82" height="80" fill="#FF5A1F" fill-opacity="0.15" />
    <circle cx="274" cy="102" r="4" fill="#FF5A1F" />
    
    <rect x="432" y="254" width="86" height="80" fill="#FF5A1F" fill-opacity="0.15" />
    <circle cx="446" cy="270" r="4" fill="#FF5A1F" />
  </g>

  <text x="320" y="650" text-anchor="middle" fill="#0B0B0B" font-family="'Archivo', sans-serif" font-weight="900" font-size="44" letter-spacing="-2">30-DAY ROADMAP</text>
  <text x="320" y="685" text-anchor="middle" fill="#5E5E5B" font-family="monospace" font-size="13" letter-spacing="2">PILLARS · TIMING · TOPIC ROTATION</text>
</svg>
